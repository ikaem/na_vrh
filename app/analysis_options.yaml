# Base ruleset: the recommended Flutter lints. A stricter opinionated package
# (e.g. very_good_analysis) enables many rules at once, which is more to review
# than it is worth at this size, so we add a short list of extras below.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    # No implicit downcasts from dynamic.
    strict-casts: true
    # No silently inferred `dynamic` where a type could not be inferred.
    strict-inference: true
    # No generic types written without their type arguments (e.g. bare `List`).
    strict-raw-types: true

linter:
  rules:
    # Enforces the "package imports across folders" convention (see CLAUDE.md).
    - always_use_package_imports
    # Keeps import/export order consistent so diffs stay small.
    - directives_ordering
    # A forgotten `await` on a Future is a silent bug; make it a finding.
    - unawaited_futures
    # One quote style across the codebase.
    - prefer_single_quotes
    # Locals that are never reassigned say so.
    - prefer_final_locals
    # Keeps pubspec dependency lists alphabetical.
    - sort_pub_dependencies
